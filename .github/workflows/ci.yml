# =====================================================================
# CI/CD - TỰ ĐỘNG BUILD VÀ DEPLOY LÊN VPS MỖI KHI PUSH LÊN MAIN
# =====================================================================
#
# File này nằm ở .github/workflows/ci.yml.
# GitHub tự tìm mọi file .yml trong thư mục .github/workflows và làm theo nội dung bên trong.
#
# Workflow gồm 2 job chạy nối tiếp nhau:
#   1. build : tải code, cài Java, build ra file JAR      → CI (kiểm tra code có build được không)
#   2. deploy: SSH vào VPS, chạy deploy.sh                → CD (đưa code mới lên server)
# Job deploy chỉ chạy khi job build xanh, và chỉ khi code nằm trên nhánh main.
#
# -----------------------------------------------------
# Từ vựng cần biết
# -----------------------------------------------------
# - Workflow: 1 quy trình tự động, chính là file này.
# - Event   : sự kiện kích hoạt workflow (khai báo ở phần on:), VD push code lên GitHub.
# - Job     : 1 nhóm việc chạy trên 1 máy riêng. 1 workflow có thể có nhiều job.
# - Runner  : máy ảo GitHub cho mượn để chạy job (ở đây là Ubuntu Linux).
#             Mỗi lần chạy là 1 máy trống hoàn toàn mới, chạy xong máy bị xóa.
# - Step    : từng bước nhỏ trong 1 job, chạy lần lượt từ trên xuống.
#             Bước nào lỗi thì các bước sau không chạy nữa, job báo đỏ.
# - Action  : step viết sẵn do người khác làm, gọi bằng uses: (giống dùng thư viện).
# - Secret  : thông tin bí mật cất trong Settings → Secrets and variables → Actions,
#             gọi ra bằng ${{ secrets.TÊN }}. Không ai xem lại được, lỡ in ra log thì bị che thành ***.
#
# -----------------------------------------------------
# YAML là gì?
# -----------------------------------------------------
# Định dạng file cấu hình, dùng thụt lề để thể hiện cấp cha con (giống Python).
# - Chỉ thụt lề bằng dấu cách, không dùng phím Tab.
# - Thụt lề sai 1 dấu cách là file hỏng, GitHub báo lỗi ngay trong tab Actions.
# - "tên: giá trị"  là 1 cặp khóa và giá trị.
# - Dòng bắt đầu bằng "- " là 1 phần tử của danh sách.
# - Dấu # bắt đầu 1 dòng comment, GitHub bỏ qua.

# Tên workflow, hiển thị trong tab Actions trên GitHub.
name: CI/CD

# =====================================================================
# KHI NÀO WORKFLOW CHẠY?
# =====================================================================
on:
  # Mỗi lần push code lên nhánh main → build, rồi deploy.
  push:
    branches: [ main ]

  # Mỗi lần tạo hoặc cập nhật 1 Pull Request muốn gộp vào main → chỉ build, không deploy.
  # Làm tính năng mới trên nhánh riêng (VD nhánh playlist), mở Pull Request là biết ngay
  # code có build được không, trước khi gộp vào main.
  pull_request:
    branches: [ main ]

  # Thêm nút "Run workflow" trong tab Actions, để chạy bằng tay khi cần mà không phải push.
  # Chạy bằng tay trên nhánh main thì cũng deploy (VD muốn khởi động lại server với code hiện tại).
  workflow_dispatch:

# Quyền của workflow: chỉ cần đọc code, không cần ghi gì lên repo.
# Nguyên tắc bảo mật: chỉ cấp đúng quyền cần dùng, không cấp thừa.
permissions:
  contents: read

jobs:
  # =====================================================================
  # JOB 1 - BUILD: TẢI CODE, CÀI JAVA, BUILD RA FILE JAR
  # =====================================================================
  # "build" là tên mã của job (tự đặt). Job deploy bên dưới dùng tên này để chờ job build.
  build:
    # Tên hiển thị trên giao diện GitHub.
    name: Build with Maven

    # Chạy trên máy ảo Ubuntu bản mới nhất GitHub đang cung cấp.
    runs-on: ubuntu-latest

    # Chạy quá 15 phút thì GitHub tự dừng, tránh tốn phút miễn phí nếu bị treo.
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------
      # Bước 1: tải code của repo về máy ảo
      # -----------------------------------------------------
      # Máy ảo lúc đầu trống trơn, chưa có code. Action checkout làm việc giống lệnh git clone.
      # @v5 là phiên bản của action. Ghi rõ phiên bản để action không tự đổi cách chạy.
      - name: Checkout code
        uses: actions/checkout@v5

      # -----------------------------------------------------
      # Bước 2: cài Java 17
      # -----------------------------------------------------
      # with: truyền tham số cho action, giống truyền tham số khi gọi hàm.
      # - distribution: temurin → bản Java miễn phí phổ biến (Eclipse Temurin).
      # - java-version: '17'    → trùng với <java.version>17</java.version> trong pom.xml.
      #   Đặt trong dấu nháy để YAML hiểu là chuỗi, không phải số.
      # - cache: maven          → lưu lại thư viện Maven đã tải (thư mục ~/.m2).
      #   Lần đầu phải tải hết thư viện (Spring, MySQL driver, jjwt...) nên chậm.
      #   Các lần sau lấy lại từ cache, nhanh hơn nhiều.
      #   Cache tự làm mới khi file pom.xml thay đổi (VD thêm dependency mới).
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # -----------------------------------------------------
      # Bước 3: cấp quyền chạy cho file mvnw
      # -----------------------------------------------------
      # run: chạy 1 lệnh trong terminal Linux của máy ảo.
      # mvnw (Maven Wrapper) là script tự tải đúng phiên bản Maven mà project cần.
      # File mvnw trong repo đang thiếu quyền chạy (do commit từ Windows),
      # thiếu bước này thì bước 4 báo lỗi "Permission denied".
      # chmod +x = thêm quyền chạy (x = execute) cho file.
      - name: Make mvnw executable
        run: chmod +x mvnw

      # -----------------------------------------------------
      # Bước 4: build project ra file JAR
      # -----------------------------------------------------
      # ./mvnw package: compile code, đóng gói thành target/myspotify-0.0.1-SNAPSHOT.jar.
      # - -B (batch mode): chế độ không tương tác, log gọn hơn, phù hợp khi chạy tự động.
      # - -DskipTests    : không chạy test (test vẫn được compile, nên test viết sai cú pháp
      #                    vẫn bị phát hiện). Tạm bỏ qua vì 6 test hiện tại cần MySQL, Redis,
      #                    MongoDB và file trên máy cá nhân, máy ảo của GitHub không có.
      #
      # Code compile lỗi (thiếu dấu ;, sai tên biến, gọi hàm không tồn tại...)
      # → lệnh này thất bại → job báo đỏ ❌ → job deploy không chạy → server giữ nguyên bản cũ.
      - name: Build (skip tests)
        run: ./mvnw -B package -DskipTests

  # =====================================================================
  # JOB 2 - DEPLOY: SSH VÀO VPS, CHẠY DEPLOY.SH
  # =====================================================================
  # Job này không build lại trên máy ảo, mà nhờ VPS tự làm, đúng như khi bạn deploy bằng tay:
  #   GitHub SSH vào VPS → chạy bash /home/myspotify/deploy.sh
  #   → deploy.sh: git pull → build bằng Maven → tắt app cũ → chạy app mới
  #   → chờ /actuator/health trả về "UP".
  #
  # deploy.sh tự trả về mã lỗi (exit 1) khi bất kỳ bước nào hỏng
  # (pull lỗi, build lỗi, app không khởi động được trong 60 giây).
  # → Job này báo đỏ ❌, và log của GitHub hiện luôn 30 dòng cuối của app.log để tìm lỗi.
  deploy:
    name: Deploy to VPS

    # needs: chỉ chạy sau khi job build chạy xong và thành công.
    # Không có dòng này thì 2 job chạy song song, code lỗi vẫn bị deploy.
    needs: build

    # if: điều kiện để job được chạy. Chỉ deploy khi thỏa cả 2 ý:
    # 1. Sự kiện là push hoặc bấm "Run workflow" bằng tay (không phải Pull Request).
    #    Pull Request chỉ để kiểm tra build, code chưa được gộp vào main thì không deploy.
    # 2. github.ref == 'refs/heads/main': đang chạy trên nhánh main.
    #    refs/heads/main là tên đầy đủ của nhánh main trong Git.
    # Ký hiệu: || nghĩa là "hoặc", && nghĩa là "và".
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # Deploy gồm build trên VPS (khoảng 1 đến 2 phút) và chờ app khởi động (tối đa 60 giây).
    # Quá 15 phút thì chắc chắn có gì bất thường, GitHub tự dừng.
    timeout-minutes: 15

    # concurrency: mỗi lúc chỉ có 1 lần deploy chạy.
    # Push 2 lần liên tiếp thì lần deploy sau phải chờ lần trước xong,
    # tránh 2 lần deploy.sh cùng lúc tắt và bật app, giẫm chân nhau.
    # - group: tên nhóm (tự đặt). Các lần chạy cùng tên nhóm thì phải xếp hàng.
    # - cancel-in-progress: false → không hủy lần đang chạy giữa chừng, để nó chạy xong.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      # -----------------------------------------------------
      # Bước duy nhất: SSH vào VPS và chạy deploy.sh
      # -----------------------------------------------------
      # appleboy/ssh-action: action có sẵn, làm đúng việc "ssh vào máy chủ rồi chạy lệnh".
      #
      # Tham số:
      # - host    : địa chỉ VPS, lấy từ secret VPS_HOST (157.66.100.87).
      # - username: user đăng nhập, lấy từ secret VPS_USER (root).
      # - key     : private key, lấy từ secret VPS_SSH_KEY.
      #             VPS so khớp với public key trong ~/.ssh/authorized_keys rồi cho vào,
      #             không cần mật khẩu.
      # - port    : cổng SSH, mặc định của Linux là 22.
      # - command_timeout: chạy lệnh quá 10 phút thì dừng.
      # - script  : lệnh chạy trên VPS. Giống hệt lệnh bạn vẫn gõ khi deploy bằng tay.
      #
      # Mã lỗi của deploy.sh được trả về cho GitHub:
      # exit 0 → bước này xanh ✅, exit 1 → bước này đỏ ❌.
      - name: Run deploy.sh on VPS
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: bash /home/myspotify/deploy.sh